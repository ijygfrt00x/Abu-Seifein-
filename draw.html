<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>سحب الجوائز | أسرة أبي سيفين وتماف إيريني</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Tahoma,Arial,sans-serif;
  background:radial-gradient(circle at top,#24150a 0,#0b0b0b 48%,#050505 100%);
  color:#fff; overflow-x:hidden;
}
.wrap{max-width:1000px;margin:auto;padding:18px}
.card{
  background:rgba(20,20,20,.92);border:1px solid rgba(212,175,55,.35);
  border-radius:24px;box-shadow:0 15px 60px #000;padding:24px;
}
header{text-align:center;padding:12px 8px 24px}
.logo{font-size:48px}
h1{margin:8px 0;color:#e8c65b;font-size:clamp(25px,6vw,44px)}
.sub{color:#ddd;font-size:18px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:18px 0}
button,input,select{font:inherit;border-radius:14px;border:1px solid #806822;padding:13px;background:#111;color:#fff}
button{cursor:pointer;font-weight:bold}
.primary{background:linear-gradient(135deg,#b8860b,#f2d36b);color:#111;border:0;font-size:20px}
.secondary{background:#181818}
button:disabled{opacity:.45;cursor:not-allowed}
label{display:block;color:#e8c65b;margin-bottom:6px}
.stage{
  min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;border-radius:22px;background:linear-gradient(180deg,#16110b,#090909);
  border:1px solid rgba(232,198,91,.3);position:relative;overflow:hidden
}
.status{color:#ccc;font-size:18px;min-height:30px}
.number{font-size:clamp(80px,20vw,180px);font-weight:900;color:#f0d36d;line-height:1;text-shadow:0 0 35px rgba(240,211,109,.5)}
.winner{font-size:clamp(28px,7vw,52px);font-weight:900;color:#fff;margin-top:15px}
.small{color:#aaa;margin-top:7px}
.panel{margin-top:18px}
.panel h2{color:#e8c65b;font-size:22px}
.winners{display:grid;gap:9px}
.winnerRow{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;background:#111;border-radius:12px;border:1px solid #292929}
.empty{color:#999;text-align:center;padding:20px}
footer{text-align:center;color:#777;padding:22px;font-size:13px}
.hidden{display:none!important}
.shake{animation:shake .08s linear infinite}
@keyframes shake{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}100%{transform:translateX(-2px)}}
.pop{animation:pop .65s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:50}
.note{font-size:13px;color:#999;line-height:1.7;margin-top:8px}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
<div class="card">
<header>
  <div class="logo">🎁</div>
  <h1>أسرة أبي سيفين وتماف إيريني</h1>
  <div class="sub">🎉 سحب الجوائز</div>
</header>

<div class="controls">
  <div>
    <label>عدد الجوائز</label>
    <input id="prizeCount" type="number" min="1" max="100" value="3">
  </div>
  <div>
    <label>الجائزة الحالية</label>
    <input id="prizeName" value="الجائزة الكبرى">
  </div>
  <div>
    <label>تكرار الفائز</label>
    <select id="allowRepeat">
      <option value="no">ممنوع — كل شخص مرة واحدة</option>
      <option value="yes">مسموح</option>
    </select>
  </div>
  <div style="display:flex;align-items:end">
    <button id="start" class="primary" style="width:100%">🎉 ابدأ السحب</button>
  </div>
</div>

<section class="stage">
  <div id="status" class="status">جاهز للسحب من الحاضرين المسجلين</div>
  <div id="number" class="number">—</div>
  <div id="winner" class="winner"></div>
  <div id="small" class="small"></div>
</section>

<div class="controls">
  <button id="next" class="secondary">🎁 الجائزة التالية</button>
  <button id="reset" class="secondary">🗑️ تصفير نتائج السحب</button>
</div>

<section class="panel">
  <h2>🏆 الفائزون السابقون</h2>
  <div id="winners" class="winners"><div class="empty">لا توجد نتائج بعد</div></div>
</section>

<div class="note">
  السحب مصمم ليختار من الحاضرين فقط. عند ربطه بقاعدة Firestore سيقرأ قائمة الحضور مباشرة، وتُحفظ نتائج السحب على الجهاز حتى بعد تحديث الصفحة.
</div>
</div>
<footer>done by Nader Samir</footer>
</div>

<script>
/* =========================
   إعداد Firestore
   =========================
   ضع بيانات Web App الخاصة بمشروع Firebase هنا.
   المشروع: abu-seifein-youth
*/
const FIREBASE_CONFIG = {
  apiKey: "PUT_YOUR_FIREBASE_API_KEY",
  authDomain: "abu-seifein-youth.firebaseapp.com",
  projectId: "abu-seifein-youth",
  storageBucket: "abu-seifein-youth.firebasestorage.app",
  messagingSenderId: "PUT_YOUR_SENDER_ID",
  appId: "PUT_YOUR_APP_ID"
};

/*
  غيّر أسماء الحقول/المجموعة هنا فقط إذا كان موقع الحضور
  يستخدم أسماء مختلفة.
*/
const ATTENDANCE_COLLECTION = "attendance";
const NAME_FIELDS = ["name","fullName","studentName","الاسم"];
const CODE_FIELDS = ["code","id","number","الكود"];

let attendees = [];
let drawn = JSON.parse(localStorage.getItem("draw_winners_v1") || "[]");
let busy = false;
let prizeNo = drawn.length + 1;

const $ = id => document.getElementById(id);
const statusEl=$("status"), numberEl=$("number"), winnerEl=$("winner"), smallEl=$("small");

function save(){ localStorage.setItem("draw_winners_v1",JSON.stringify(drawn)); renderWinners(); }

function getField(obj, fields){
  for(const f of fields) if(obj[f] !== undefined && obj[f] !== null && String(obj[f]).trim()!=="") return String(obj[f]).trim();
  return "";
}

function renderWinners(){
  const box=$("winners");
  if(!drawn.length){box.innerHTML='<div class="empty">لا توجد نتائج بعد</div>';return;}
  box.innerHTML=drawn.map((w,i)=>`
    <div class="winnerRow">
      <span>🏆 ${i+1}. ${escapeHtml(w.prize)}</span>
      <strong>${escapeHtml(w.name)} — ${escapeHtml(w.code)}</strong>
    </div>`).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

async function loadAttendance(){
  /*
    لو Firebase غير مضبوط، يسمح الموقع مؤقتاً بقائمة تجريبية محلية.
    بعد وضع Firebase Config سيقرأ Firestore.
  */
  if(FIREBASE_CONFIG.apiKey.startsWith("PUT_")){
    const local = JSON.parse(localStorage.getItem("demo_attendees_v1") || "null");
    if(local && Array.isArray(local) && local.length){attendees=local;return;}
    attendees = Array.from({length:70},(_,i)=>({code:String(i+1).padStart(3,"0"),name:"مشارك "+(i+1)}));
    return;
  }

  try{
    const [{initializeApp}, fs] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js")
    ]);
    const app=initializeApp(FIREBASE_CONFIG);
    const {getFirestore,collection,getDocs}=fs;
    const db=getFirestore(app);
    const snap=await getDocs(collection(db,ATTENDANCE_COLLECTION));
    attendees=snap.docs.map(d=>({id:d.id,...d.data()}))
      .map(x=>({code:getField(x,CODE_FIELDS),name:getField(x,NAME_FIELDS),raw:x}))
      .filter(x=>x.name || x.code);
    if(!attendees.length) throw new Error("لم يتم العثور على حضور في المجموعة المحددة.");
  }catch(e){
    console.error(e);
    statusEl.textContent="تعذر قراءة الحضور من Firestore — راجع إعدادات المجموعة.";
    attendees=[];
  }
}

function available(){
  const repeat=$("allowRepeat").value==="yes";
  if(repeat) return attendees;
  const used=new Set(drawn.map(x=>x.code));
  return attendees.filter(x=>!used.has(x.code));
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function beep(freq=700,duration=.12){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    const c=new C(),o=c.createOscillator(),g=c.createGain();
    o.frequency.value=freq;o.type="sine";g.gain.value=.06;o.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+duration);
  }catch(e){}
}

async function countdown(){
  for(const n of [3,2,1]){
    numberEl.textContent=n; winnerEl.textContent="";
    statusEl.textContent="استعد..."; beep(500+n*130,.18);
    numberEl.classList.add("pop"); await sleep(700); numberEl.classList.remove("pop");
  }
}

async function draw(){
  if(busy)return;
  busy=true;
  $("start").disabled=true;$("next").disabled=true;
  winnerEl.textContent="";smallEl.textContent="";
  await loadAttendance();
  const pool=available();
  if(!pool.length){
    statusEl.textContent="لا يوجد مشاركون مؤهلون للسحب.";
    numberEl.textContent="—";busy=false;$("start").disabled=false;return;
  }
  await countdown();

  statusEl.textContent="🎲 جاري اختيار الفائز...";
  numberEl.classList.add("shake");
  let last=null;
  const duration=2700,start=performance.now();
  while(performance.now()-start<duration){
    last=pool[Math.floor(Math.random()*pool.length)];
    numberEl.textContent=last.code || "???";
    await sleep(Math.max(25,100-(performance.now()-start)/35));
  }
  numberEl.classList.remove("shake");

  const final=pool[Math.floor(Math.random()*pool.length)];
  numberEl.textContent=final.code || "—";
  statusEl.textContent="🎉 والفائز هو...";
  await sleep(450);
  winnerEl.textContent=final.name || "مبروك!";
  winnerEl.classList.add("pop");
  smallEl.textContent=$("prizeName").value || ("الجائزة رقم "+prizeNo);

  drawn.push({
    code:final.code,name:final.name,
    prize:$("prizeName").value || ("الجائزة رقم "+prizeNo),
    time:new Date().toLocaleString("ar-EG")
  });
  save(); prizeNo=drawn.length+1;
  fireConfetti(); beep(950,.25); await sleep(200);
  $("next").disabled=false;$("start").disabled=false;busy=false;
}

function fireConfetti(){
  const c=$("confetti"),ctx=c.getContext("2d");
  c.width=innerWidth;c.height=innerHeight;
  const p=Array.from({length:180},()=>({x:innerWidth/2,y:innerHeight*.35,
    vx:(Math.random()-.5)*12,vy:Math.random()*-10-3,
    r:Math.random()*5+2,life:Math.random()*90+60}));
  let frame=0;
  function loop(){
    ctx.clearRect(0,0,c.width,c.height);
    p.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.vy+=.18;a.life--;
      ctx.fillStyle=`hsl(${Math.random()*360},90%,60%)`;ctx.fillRect(a.x,a.y,a.r,a.r);
    });
    if(frame++<110)requestAnimationFrame(loop);else ctx.clearRect(0,0,c.width,c.height);
  }loop();
}

$("start").onclick=draw;
$("next").onclick=()=>{prizeNo=drawn.length+1;$("prizeName").value="الجائزة رقم "+prizeNo; $("start").click();};
$("reset").onclick=()=>{if(confirm("تأكيد حذف كل نتائج السحب المحفوظة؟")){drawn=[];prizeNo=1;save();statusEl.textContent="تم تصفير النتائج.";numberEl.textContent="—";winnerEl.textContent="";smallEl.textContent="";}};
renderWinners();
loadAttendance();
</script>
</body>
</html>
